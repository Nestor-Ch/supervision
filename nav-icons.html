<script>
// Swaps each top-level page tab's text for a Bootstrap Icon (original text kept
// as a hover label) and inserts a plain-text page title banner at the top of
// that page. Keys must equal each page's `#` heading text exactly - a rename
// that isn't mirrored here silently falls back to the plain-text tab.
document.addEventListener("DOMContentLoaded", function () {
  var NAV_ICONS = {
    "Загальне": "bi-book",
    "Поінформованість": "bi-info-circle",
    "Замовлення супервізії": "bi-cart-check",
    "Досвід участі": "bi-journal-check",
    "Роль адміністрації": "bi-diagram-3",
    "Порівняння адміністрації та вчителів": "bi-people",
    "Методологія": "bi-journal-text"
  };
  document.querySelectorAll("a.nav-link").forEach(function (a) {
    var text = a.textContent.trim();
    var icon = NAV_ICONS[text];
    if (!icon) return;
    a.innerHTML = '<i class="bi ' + icon + ' nav-icon"></i>' +
                  '<span class="nav-label">' + text + '</span>';
    var id = (a.getAttribute("href") || "").replace("#", "");
    var page = id ? document.getElementById(id) : null;
    if (page) {
      var title = document.createElement("div");
      title.className = "page-title";
      title.textContent = text;
      page.insertBefore(title, page.firstChild);
    }
  });

  // bslib sidebars on non-initial pages are built while their tab is hidden
  // (zero width) and end up collapsed, at an unpredictable moment after load.
  // Keep opening visible collapsed sidebars (polled briefly after load and on
  // every tab switch) until the user collapses one themselves (a trusted click
  // on its toggle), after which that sidebar is left alone.
  var touched = new WeakSet();
  document.querySelectorAll(".bslib-sidebar-layout").forEach(function (el) {
    var t = el.querySelector(":scope > .collapse-toggle");
    if (t) t.addEventListener("click", function (e) { if (e.isTrusted) touched.add(el); });
  });
  function openVisibleSidebars() {
    document.querySelectorAll(".bslib-sidebar-layout").forEach(function (el) {
      if (touched.has(el) || el.offsetWidth === 0) return;
      if (!el.classList.contains("sidebar-collapsed")) return;
      var t = el.querySelector(":scope > .collapse-toggle");
      if (t) t.click();
    });
  }
  var tries = 0;
  var timer = setInterval(function () {
    openVisibleSidebars();
    if (++tries > 24) clearInterval(timer);
  }, 250);
  document.querySelectorAll('a.nav-link[data-bs-toggle="tab"]').forEach(function (a) {
    a.addEventListener("shown.bs.tab", function () { setTimeout(openVisibleSidebars, 150); });
  });
});
</script>
